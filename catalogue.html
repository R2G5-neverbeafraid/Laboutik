  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

<body data-page="catalogue">
  <a class="skip-link" href="#contenu">Aller au contenu</a>
  <main id="contenu">
    <div class="container section--tight">
      <h1>Catalogue</h1>
      <div id="catalogue-filtres"></div>
      <div class="toolbar">
        <p id="catalogue-compteur" class="note" aria-live="polite"></p>
        <div class="selects">
          <label class="sort">Marque
            <select id="catalogue-marque"></select>
          </label>
          <label class="sort">Trier
            <select id="catalogue-tri">
              <option value="">Par défaut</option>
              <option value="prix-asc">Prix croissant</option>
              <option value="prix-desc">Prix décroissant</option>
              <option value="marque">Marque (A–Z)</option>
            </select>
          </label>
        </div>
      </div>
      <ul id="catalogue-grille" class="grid-products"></ul>
      <noscript><p class="empty">Active JavaScript pour voir le catalogue.</p></noscript>
    </div>
  </main>
  <script type="module" src="js/catalogue.js"></script>
</body>
</html>
